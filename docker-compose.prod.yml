services:
  database:
    image: postgres:17
    container_name: events-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME} -d ${DATABASE_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  api:
    image: "willf7/events-api:${IMAGE_TAG:-latest}"
    container_name: events-api
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    env_file:
      - .env
    expose:
      - "8080"
    networks:
      - internal
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.events-api.rule=Host(`api-events.willcode.space`)"
      - "traefik.http.routers.events-api.entrypoints=websecure"
      - "traefik.http.routers.events-api.tls=true"
      - "traefik.http.routers.events-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.events-api.loadbalancer.server.port=8080"

volumes:
  postgres_data:
networks:
  internal:
  proxy:
    external: true